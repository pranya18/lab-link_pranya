
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabLink | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-container">

    <div class="login-box">

        <a href="index.html" class="back-link">← Back to Home</a>

        <h1>Welcome to LabLink</h1>
        <p>Login to access campus laboratory resources.</p>

        <form id="loginForm">

            <label>Select Your Role</label>

            <select id="role" required>
                <option value="">Choose your role</option>
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
                <option value="admin">Administrator</option>
            </select>

            <label>Email Address</label>
            <input type="email" id="email"
                placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password"
                placeholder="Enter your password" required>

            <button type="submit" class="primary-btn full-btn">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

        <p class="login-note">
            Demo prototype: use the role selector
            to explore the different dashboards.
        </p>

    </div>

</div>

<script src="js/auth.js"></script>
</body>
</html>
